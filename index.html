<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KKDGMS School Website</title>
<style>
body { font-family: Arial; margin: 0; padding: 10px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.container { max-width: 1200px; margin: 0 auto; background: white; padding: 15px; border-radius: 15px; min-height: 90vh; }
.header { background: linear-gradient(90deg, #FF5722, #E91E63); color: white; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 10px; }
.header h1 { margin: 0; font-size: 32px; }
.login-form { max-width: 400px; margin: 30px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
button { background: #4CAF50; color: white; border: none; cursor: pointer; font-weight: bold; }
button:hover { background: #45a049; }
.hidden { display: none; }
.footer { text-align: center; padding: 12px; background: #333; color: white; border-radius: 0 0 15px 15px; margin-top: 20px; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>KKDGMS</h1>
        <p>School Website</p>
    </div>

    <div id="loginSection" class="login-form">
        <h2>Login</h2>
        <select id="userType">
            <option value="admin">Admin</option>
            <option value="student">Student</option>
        </select>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <div id="adminPanel" class="hidden">
        <h2>Admin Panel - Welcome!</h2>
        <p>Login Success ✅</p>
        <button onclick="logout()">Logout</button>
    </div>

    <div id="studentPanel" class="hidden">
        <h2>Student Panel - Welcome!</h2>
        <p>Login Success ✅</p>
        <button onclick="logout()">Logout</button>
    </div>

    <div class="footer">
        <b>Website Developer:</b> VALLIVEL P
    </div>
</div>

<script>
// SIMPLE LOGIN - NO ERROR
function login() {
    const type = document.getElementById('userType').value;
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();

    if(user === '' || pass === '') {
        alert('Username மற்றும் Password-ஐ Enter பண்ணுங்க');
        return;
    }

    if(type === 'admin') {
        if(user === 'kkdgms' && pass === '1988') {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
        } else {
            alert('Admin Login தப்பு! \nUsername: kkdgms \nPassword: 1988');
        }
    } 

    if(type === 'student') {
        if(user === 'kkdgms' && pass === '2027') {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('studentPanel').classList.remove('hidden');
        } else {
            alert('Student Login தப்பு! \nUsername: kkdgms \nPassword: 2027');
        }
    }
}

function logout() {
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    document.getElementById('loginSection').classList.remove('hidden');
    document.getElementById('adminPanel').classList.add('hidden');
    document.getElementById('studentPanel').classList.add('hidden');
}
</script>
</body>
</html>
