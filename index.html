<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<title>KKDGMS - School Portal</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600;700&display=swap');
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
    body{background:linear-gradient(135deg,#0a0f29,#1a2a6c);min-height:100vh;color:#fff;}
.header{text-align:center;padding:25px;background:rgba(0,0,0,0.6);border-bottom:3px solid #00ff88;}
.header h1{color:#00ff88;font-size:26px;margin-bottom:10px;}
.datetime-box{background:rgba(0,0,0,0.8);padding:20px;border-radius:15px;margin:15px auto;max-width:600px;border:2px solid #00d4ff;}
.full-date{font-size:28px;color:#00ff88;font-weight:700;margin-bottom:10px;text-shadow:0 0 10px #00ff88;}
.clock{font-family:'Orbitron';font-size:45px;font-weight:700;margin-top:10px;}
.hour{color:#ffdd00;text-shadow:0 0 15px #ffdd00;}
.min{color:#00ff88;text-shadow:0 0 15px #00ff88;}
.sec{color:#ff6600;text-shadow:0 0 15px #ff6600;}
.ampm{color:#00d4ff;text-shadow:0 0 15px #00d4ff;}
.views{font-family:'Orbitron';font-size:20px;color:#00d4ff;margin-top:10px;}
.container{max-width:1100px;margin:30px auto;padding:20px;}
.login-box,.dashboard{background:rgba(0,0,0,0.7);padding:30px;border-radius:20px;border:2px solid #00ff88;margin-bottom:20px;}
input,button{width:100%;padding:14px;margin:10px 0;border:none;border-radius:10px;font-size:16px;}
input{background:#222;color:#fff;border:1px solid #00ff88;}
button{background:linear-gradient(90deg,#00ff88,#00d4ff);color:#000;font-weight:700;cursor:pointer;font-size:18px;}
.hidden{display:none;}
.btn-group{display:flex;gap:15px;}
.btn-group button{flex:1;background:#ff6600;color:#fff;}
.class-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:20px 0;}
.class-btns button{background:linear-gradient(90deg,#ff0044,#ff6600);font-size:20px;}
.calendar-nav{display:flex;justify-content:space-between;align-items:center;margin:15px 0;}
.calendar-nav button{width:auto;padding:10px 20px;background:#00ff88;}
.calendar-header{text-align:center;font-size:24px;color:#00ff88;font-weight:700;}
.calendar-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px;}
.calendar-weekdays div{text-align:center;font-weight:700;color:#ffdd00;padding:10px;background:#222;border-radius:8px;}
.calendar-days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.date-box{padding:15px;background:#2a2a2a;text-align:center;border-radius:10px;cursor:pointer;font-weight:600;}
.date-box:hover{background:#00ff88;color:#000;}
.empty{background:transparent!important;cursor:default!important;}
.has-link{background:#ff6600!important;color:#fff!important;}
.link-box{margin-top:20px;padding:20px;background:#111;border-radius:15px;border:2px dashed #00ff88;min-height:80px;}
.link-row{display:flex;align-items:center;gap:10px;margin:10px 0;background:#1a1a1a;padding:12px;border-radius:10px;}
.link-row a{flex:1;color:#00ff88;font-size:18px;text-decoration:none;font-weight:700;}
.student-link{padding:15px;background:#003366;border-left:5px solid #00d4ff;margin:10px 0;border-radius:10px;}
.student-link a{color:#00ff88;font-size:20px;text-decoration:none;font-weight:700;}
.logout{background:#ff0044;color:#fff;}
h2,h3,h4{color:#00ff88;margin-bottom:15px;text-align:center;}
.info{font-size:14px;color:#aaa;text-align:center;margin:10px 0;}
.label{color:#ffdd00;font-weight:600;margin-top:10px;}
.day-info{color:#00d4ff;font-size:18px;text-align:center;margin-bottom:15px;font-weight:700;}
</style>
</head>
<body>

<div class="header">
    <h1>KANYAKUMARI DISTRICT GOVERNMENT MODEL SCHOOL</h1>
    <div class="datetime-box">
        <div class="full-date" id="fullDate"></div>
        <div class="clock" id="clock"></div>
        <div class="views">TOTAL VIEWS: <span id="viewCount">0000</span></div>
    </div>
</div>

<div class="container">
<div class="login-box" id="mainLogin">
    <h2>LOGIN TYPE</h2>
    <div class="btn-group">
        <button onclick="showLogin('admin')">👨‍🏫 ADMIN LOGIN</button>
        <button onclick="showLogin('student')">👨‍🎓 STUDENT LOGIN</button>
    </div>
</div>

<div class="login-box hidden" id="adminLoginBox">
    <h2>👨‍🏫 ADMIN LOGIN</h2>
    <input type="text" id="adminUser" placeholder="Username">
    <input type="password" id="adminPass" placeholder="Password">
    <button onclick="adminLogin()">Login</button>
    <button class="logout" onclick="backToMain()">Back</button>
</div>

<div class="login-box hidden" id="studentLoginBox">
    <h2>👨‍🎓 STUDENT LOGIN</h2>
    <input type="text" id="studentUser" placeholder="Username">
    <input type="password" id="studentPass" placeholder="Password">
    <button onclick="studentLogin()">Login</button>
    <button class="logout" onclick="backToMain()">Back</button>
</div>

<div class="dashboard hidden" id="adminPanel">
    <h2>👨‍🏫 ADMIN DASHBOARD</h2>
    <button class="logout" onclick="logout()">Logout</button>
    <p class="info">Class Select → Month மாத்தலாம் → Date Click → Link Paste பண்ணி Save பண்ணுங்க</p>
    <div class="class-btns">
        <button onclick="openAdminCalendar('9')">Class 9</button>
        <button onclick="openAdminCalendar('10')">Class 10</button>
        <button onclick="openAdminCalendar('11')">Class 11</button>
        <button onclick="openAdminCalendar('12')">Class 12</button>
    </div>
    <div id="adminCalendarArea"></div>
</div>

<div class="dashboard hidden" id="studentPanel">
    <h2>👨‍🎓 STUDENT DASHBOARD</h2>
    <button class="logout" onclick="logout()">Logout</button>
    <p class="info">Class Select → Month மாத்தலாம் → Date Click → Link Open பண்ணுங்க</p>
    <div class="class-btns">
        <button onclick="openStudentCalendar('9')">Class 9</button>
        <button onclick="openStudentCalendar('10')">Class 10</button>
        <button onclick="openStudentCalendar('11')">Class 11</button>
        <button onclick="openStudentCalendar('12')">Class 12</button>
    </div>
    <div id="studentCalendarArea"></div>
</div>
</div>

<script>
// FIXED STORAGE KEY - இனி மாத்தாதீங்க
const STORAGE_KEY = 'kkdgmsData_permanent';

function loadData(){
    try{
        let data = localStorage.getItem(STORAGE_KEY);
        console.log("Loaded Data:", data);
        return data? JSON.parse(data) : { links: {}, views: 0 };
    } catch(e){
        console.error("Load Error:", e);
        return { links: {}, views: 0 };
    }
}
function saveData(data){
    try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        console.log("Saved Data:", data);
    } catch(e){
        alert("Storage Full! பழைய Link-ஐ அழிச்சுட்டு புதுசா Save பண்ணுங்க");
        console.error("Save Error:", e);
    }
}

let schoolData = loadData();

// DATE + COLORFUL TIME
function updateDateTime(){
    let d = new Date();
    let h = d.getHours(); let m = d.getMinutes(); let s = d.getSeconds();
    let ampm = h >= 12? 'PM' : 'AM'; h = h % 12; h = h? h : 12;
    let options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('fullDate').innerText = d.toLocaleDateString('en-GB', options);
    document.getElementById('clock').innerHTML =
    `<span class="hour">${String(h).padStart(2,'0')}</span>:
     <span class="min">${String(m).padStart(2,'0')}</span>:
     <span class="sec">${String(s).padStart(2,'0')}</span>
     <span class="ampm">${ampm}</span>`;
}
setInterval(updateDateTime,1000); updateDateTime();

// VIEWS COUNT
schoolData.views += 1;
saveData(schoolData);
document.getElementById('viewCount').innerText = String(schoolData.views).padStart(4,'0');

// LOGIN
function showLogin(type){
    document.getElementById('mainLogin').classList.add('hidden');
    if(type==='admin') document.getElementById('adminLoginBox').classList.remove('hidden');
    if(type==='student') document.getElementById('studentLoginBox').classList.remove('hidden');
}
function backToMain(){
    document.getElementById('mainLogin').classList.remove('hidden');
    document.getElementById('adminLoginBox').classList.add('hidden');
    document.getElementById('studentLoginBox').classList.add('hidden');
}
function adminLogin(){
    if(document.getElementById('adminUser').value === "kkdgms" && document.getElementById('adminPass').value === "1988"){
        document.getElementById('adminLoginBox').classList.add('hidden'); document.getElementById('adminPanel').classList.remove('hidden');
    } else { alert("Username or Password தவறு!"); }
}
function studentLogin(){
    if(document.getElementById('studentUser').value === "kkdgms" && document.getElementById('studentPass').value === "2027"){
        document.getElementById('studentLoginBox').classList.add('hidden'); document.getElementById('studentPanel').classList.remove('hidden');
    } else { alert("Username or Password தவறு!"); }
}
function logout(){ backToMain(); document.getElementById('adminPanel').classList.add('hidden'); document.getElementById('studentPanel').classList.add('hidden'); }

// CALENDAR
let currentClass = ""; let isAdminMode = false; let currentArea = ""; let selectedDate = "";
let calYear = new Date().getFullYear(); let calMonth = new Date().getMonth();

function openAdminCalendar(cls){ currentClass = cls; isAdminMode = true; currentArea = 'adminCalendarArea'; calYear = new Date().getFullYear(); calMonth = new Date().getMonth(); generateCalendar(); }
function openStudentCalendar(cls){ currentClass = cls; isAdminMode = false; currentArea = 'studentCalendarArea'; calYear = new Date().getFullYear(); calMonth = new Date().getMonth(); generateCalendar(); }

function changeMonth(diff){
    calMonth += diff;
    if(calMonth < 0){ calMonth = 11; calYear--; }
    if(calMonth > 11){ calMonth = 0; calYear++; }
    generateCalendar();
}

function generateCalendar(){
    let firstDay = new Date(calYear, calMonth, 1).getDay();
    let daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
    let monthName = new Date(calYear, calMonth).toLocaleString('en',{month:'long', year:'numeric'});
    let html = `<div class="calendar-nav"><button onclick="changeMonth(-1)">◀ Prev</button><div class="calendar-header">Class ${currentClass} - ${monthName}</div><button onclick="changeMonth(1)">Next ▶</button></div>`;
    html += `<div class="calendar-weekdays"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>`;
    html += `<div class="calendar-days">`;
    for(let i=0; i<firstDay; i++){ html += `<div class="date-box empty"></div>`; }
    for(let d=1; d<=daysInMonth; d++){
        let dateKey = `${calYear}-${calMonth+1}-${d}`;
        let hasLink = schoolData.links[currentClass] && schoolData.links[currentClass][dateKey]? 'has-link' : '';
        html += `<div class="date-box ${hasLink}" onclick="handleDateClick('${dateKey}')">${d}</div>`;
    }
    html += `</div><div class="link-box" id="linkBox_${currentArea}">மேல Date-ஐ Click பண்ணுங்க</div>`;
    document.getElementById(currentArea).innerHTML = html;
}

function formatDate(dateStr){
    let d = new Date(dateStr);
    let options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    return d.toLocaleDateString('en-GB', options);
}

function handleDateClick(date){
    selectedDate = date;
    let boxId = `linkBox_${currentArea}`;
    let formattedDate = formatDate(date);

    if(isAdminMode){
        let old1 = schoolData.links[currentClass]?.[date]?.link1 || "";
        let old2 = schoolData.links[currentClass]?.[date]?.link2 || "";
        let existingLinks = "";
        if(old1 || old2){
            existingLinks = `<h4>Already Saved Links:</h4>`;
            if(old1) existingLinks += `<div class="link-row"><a href="${old1}" target="_blank">▶️ Option 1</a></div>`;
            if(old2) existingLinks += `<div class="link-row"><a href="${old2}" target="_blank">📚 Option 2</a></div>`;
        }
        document.getElementById(boxId).innerHTML = `
            <div class="day-info">${formattedDate}</div>
            <h3>Link Add / Update</h3>
            ${existingLinks}
            <p class="label">Option 1: Video Link</p>
            <input type="text" id="linkInput1" placeholder="YouTube / Video Link" value="${old1}">
            <p class="label">Option 2: Book / PDF Link</p>
            <input type="text" id="linkInput2" placeholder="Drive / PDF Link" value="${old2}">
            <button onclick="saveLinks()">💾 Save Links</button>
        `;
    } else {
        let links = schoolData.links[currentClass] && schoolData.links[currentClass][date];
        if(links && (links.link1 || links.link2)){
            let html = `<div class="day-info">${formattedDate}</div><h3>Study Materials</h3>`;
            if(links.link1) html += `<div class="student-link"><a href="${links.link1}" target="_blank">▶️ Option 1: Video Link Click Here</a></div>`;
            if(links.link2) html += `<div class="student-link"><a href="${links.link2}" target="_blank">📚 Option 2: Book/PDF Link Click Here</a></div>`;
            document.getElementById(boxId).innerHTML = html;
        } else {
            document.getElementById(boxId).innerHTML = `<div class="day-info">${formattedDate}</div><p style="color:red;">❌ இந்த தேதிக்கு Link இல்லை</p>`;
        }
    }
}

function saveLinks(){
    let link1 = document.getElementById('linkInput1').value.trim();
    let link2 = document.getElementById('linkInput2').value.trim();
    if(!schoolData.links[currentClass]) schoolData.links[currentClass] = {};
    schoolData.links[currentClass][selectedDate] = {link1: link1, link2: link2};
    saveData(schoolData);
    alert("✅ Links Save ஆச்சு!");
    generateCalendar();
}
</script>
</body>
</html>
