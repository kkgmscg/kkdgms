<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KKDGMS School Website</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); background-attachment: fixed; transition: 0.3s; }
body.dark { background: linear-gradient(135deg, #232526 0%, #414345 100%); }
.container { max-width: 1200px; margin: 0 auto; background: rgba(255,255,255,0.98); padding: 15px; border-radius: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); min-height: 90vh; position: relative; padding-bottom: 70px; }
body.dark.container { background: #2d2d2d; color: white; }
.header { background: linear-gradient(90deg, #FF5722, #E91E63); color: white; padding: 20px 15px; text-align: center; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: relative; }
.header h1 { font-size: clamp(28px, 8vw, 42px); font-weight: 900; margin: 0; letter-spacing: 2px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); text-align: center; }
.header p { font-size: clamp(14px, 4vw, 18px); margin: 8px 0 0; font-weight: 600; text-align: center; }
.header.datetime { font-size: clamp(12px, 3.5vw, 15px); margin-top: 5px; font-weight: 500; opacity: 0.95; }
.dark-btn { position: absolute; right: 15px; top: 15px; background: white; color: #333; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 20px; width: auto; }
.footer { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; padding: 12px; background: #333; color: white; border-radius: 0 0 15px 15px; font-size: 13px; }
.footer.school-name { font-size: 14px; font-weight: bold; letter-spacing: 1px; }
.marquee { background: #FF9800; color: white; padding: 10px; font-weight: bold; border-radius: 8px; margin-bottom: 15px; overflow: hidden; white-space: nowrap; font-size: clamp(13px, 3.5vw, 16px); display: none; }
.marquee.show { display: block; }
.marquee span { display: inline-block; padding-left: 100%; animation: scroll-left 15s linear infinite; }
@keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); }
.login-form { max-width: 450px; margin: 20px auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
body.dark.login-form { background: #3a3a3a; }
input, select, button, textarea { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; font-weight: 600; }
body.dark input, body.dark select, body.dark textarea { background: #555; color: white; border-color: #777; }
button { background: linear-gradient(90deg, #4CAF50, #45a049); color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 16px; min-height: 48px; }
button:active { transform: scale(0.98); }
.calendar-header { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; gap: 8px; }
.calendar-header button { width: auto; padding: 10px 12px; font-size: 14px; flex-shrink: 0; }
.calendar-header h3 { font-size: clamp(16px, 4.5vw, 20px); margin: 0; text-align: center; flex: 1; }
.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin: 10px 0; }
.weekday { text-align: center; font-weight: bold; padding: 8px 2px; background: #FF5722; color: white; border-radius: 6px; font-size: clamp(11px, 3vw, 14px); }
.day { padding: 12px 2px; text-align: center; background: #f5f5f5; cursor: pointer; border-radius: 8px; transition: 0.2s; font-weight: 800; font-size: clamp(14px, 4vw, 16px); min-height: 45px; display: flex; align-items: center; justify-content: center; position: relative; }
body.dark.day { background: #444; color: white; }
.day.has-links-9 { background: #FF9800; color: white; }
.day.has-links-10 { background: #2196F3; color: white; }
.day.has-links-11 { background: #4CAF50; color: white; }
.day.has-links-12 { background: #9C27B0; color: white; }
.day-sunday { background: #FFE082!important; color: #5D4037!important; border: 2px solid #FFB300; }
.day-govt { background: #FFCDD2!important; color: #c62828!important; border: 2px solid #e53935; }
.link-item { background: linear-gradient(90deg, #FFF3E0, #FFE0B2); padding: 12px; margin: 10px 0; border-radius: 10px; border-left: 5px solid #FF5722; word-break: break-word; }
body.dark.link-item { background: #4a3a2a; }
.link-number { background: #9C27B0; color: white; padding: 4px 10px; border-radius: 5px; font-weight: bold; font-size: 12px; display: inline-block; margin-bottom: 8px; }
.link-title { font-weight: bold; color: #E91E63; margin-bottom: 6px; font-size: clamp(14px, 4vw, 16px); }
body.dark.link-title { color: #FF8A65; }
.link-item a { color: #2196F3; text-decoration: none; font-weight: 600; font-size: clamp(13px, 3.8vw, 15px); }
.delete-btn { background: #f44336; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; width: auto; margin: 0; float: right; font-size: 14px; min-height: 36px; }
.add-link-btn { background: #2196F3; margin-top: 10px; }
.hidden { display: none; }
.header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.header-bar h2 { font-size: clamp(20px, 5.5vw, 24px); margin: 0; }
.link-input-group { margin-bottom: 15px; border: 1px dashed #ccc; padding: 10px; border-radius: 8px; background: #f9f9f9; }
body.dark.link-input-group { background: #3a3a3a; border-color: #666; }
.notification-box { background: #fff3e0; padding: 12px; border-radius: 8px; margin: 15px 0; border-left: 4px solid #FF9800; }
body.dark.notification-box { background: #4a3a2a; }
.sync-box { background: #E8F5E9; padding: 15px; border-radius: 10px; margin: 15px 0; border: 2px dashed #4CAF50; }
body.dark.sync-box { background: #1b5e20; }
#jsonOutput { width: 100%; height: 150px; font-family: monospace; background: #222; color: #0f0; font-size: 12px; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div style="width:100%">
            <h1>KKDGMS</h1>
            <p>School Website</p>
            <div class="datetime" id="currentDateTime"></div>
        </div>
        <button class="dark-btn" onclick="toggleDark()">🌙</button>
    </div>

    <div id="marqueeBar" class="marquee"><span id="marqueeText"></span></div>

    <div id="loginSection" class="login-form">
        <h2>Login</h2>
        <select id="userType"><option value="admin">Admin</option><option value="student">Student</option></select>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <div id="adminPanel" class="hidden">
        <div class="header-bar"><h2>Admin Panel</h2><button onclick="logout()" style="width:auto;background:#f44336;">Logout</button></div>
        
        <div class="notification-box">
            <h3>📢 Rolling Notification</h3>
            <textarea id="notificationInput" rows="3"></textarea>
            <button onclick="saveNotification()">Update Notification</button>
        </div>

        <label>Select Class:</label>
        <select id="classSelect" onchange="showCalendar()"><option value="">-- Select Class --</option><option value="9">Class 9</option><option value="10">Class 10</option><option value="11">Class 11</option><option value="12">Class 12</option></select>

        <div id="calendarSection" class="hidden">
            <div class="calendar-header"><button onclick="prevMonth()">← Prev</button><h3 id="monthYear"></h3><button onclick="nextMonth()">Next →</button></div>
            <div id="calendar" class="calendar"></div>
            <div id="linkForm" class="hidden">
                <h4 id="selectedDate"></h4>
                <div id="linkInputs"></div>
                <button class="add-link-btn" onclick="addLinkInput()">+ Add Another</button>
                <button onclick="saveAllLinks()">Save All Links</button>
                <div id="savedLinks"></div>
            </div>
        </div>

        <div class="sync-box">
            <h4>🔄 Step 1: Generate Data for GitHub</h4>
            <button onclick="prepareData()">Generate Data</button>
            <textarea id="jsonOutput" readonly placeholder="Click 'Generate Data' button, then copy this"></textarea>
            <h4>🔄 Step 2: Paste in data.json and Commit</h4>
        </div>
    </div>

    <div id="studentPanel" class="hidden">
        <div class="header-bar"><h2>Student Panel</h2><button onclick="logout()" style="width:auto;background:#f44336;">Logout</button></div>
        <label>Select Class:</label>
        <select id="studentClassSelect" onchange="showStudentCalendar()"><option value="">-- Select Class --</option><option value="9">Class 9</option><option value="10">Class 10</option><option value="11">Class 11</option><option value="12">Class 12</option></select>
        <div id="studentCalendarSection" class="hidden">
            <div class="calendar-header"><button onclick="prevMonthStudent()">← Prev</button><h3 id="monthYearStudent"></h3><button onclick="nextMonthStudent()">Next →</button></div>
            <div id="studentCalendar" class="calendar"></div>
            <div id="studentLinks"></div>
        </div>
    </div>

    <div class="footer"><div class="school-name">KKDGMS</div><b>Website Developer:</b> VALLIVEL P</div>
</div>

<script>
let portalData = { notification: "Welcome to KKDGMS", links: {} };
let currentClass = ''; let selectedDate = '';
let currentMonth = new Date().getMonth(); let currentYear = new Date().getFullYear();
let studentMonth = new Date().getMonth(); let studentYear = new Date().getFullYear();

async function loadData() {
    try {
        let res = await fetch('data.json?v=' + new Date().getTime());
        portalData = await res.json();
    } catch(e) { console.log("data.json not found"); }
    loadNotification();
}
function loadNotification() {
    document.getElementById('marqueeText').textContent = portalData.notification || '';
    if(portalData.notification) document.getElementById('marqueeBar').classList.add('show');
}
function saveNotification() {
    portalData.notification = document.getElementById('notificationInput').value;
    alert('Notification Updated! Now click Generate Data button');
    loadNotification();
}

function login() {
    let type = document.getElementById('userType').value; let u = document.getElementById('username').value; let p = document.getElementById('password').value;
    if(u === 'kkdgms' && p === '1988' && type === 'admin') {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        document.getElementById('notificationInput').value = portalData.notification;
    } else if(u === 'kkdgms' && p === '2027' && type === 'student') {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('studentPanel').classList.remove('hidden');
    } else { alert('Wrong Login'); }
}
function logout() { location.reload(); }
function toggleDark() { document.body.classList.toggle('dark'); }

function showCalendar() { currentClass = document.getElementById('classSelect').value; if(!currentClass) return; document.getElementById('calendarSection').classList.remove('hidden'); generateCalendar('calendar', 'monthYear', true); }
function showStudentCalendar() { currentClass = document.getElementById('studentClassSelect').value; if(!currentClass) return; document.getElementById('studentCalendarSection').classList.remove('hidden'); generateCalendar('studentCalendar', 'monthYearStudent', false); }

function generateCalendar(calendarId, monthYearId, isAdmin) {
    const calendar = document.getElementById(calendarId); const monthYear = document.getElementById(monthYearId); calendar.innerHTML = '';
    let m = isAdmin? currentMonth : studentMonth; let y = isAdmin? currentYear : studentYear;
    const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    monthYear.textContent = `${monthNames[m]} ${y}`;
    const weekdays = ['S', 'M', 'T', 'W', 'T', 'F', 'S']; weekdays.forEach(day => { const d = document.createElement('div'); d.className = 'weekday'; d.textContent = day; calendar.appendChild(d); });
    const classData = portalData.links[currentClass] || {};
    const firstDay = new Date(y, m, 1).getDay(); const daysInMonth = new Date(y, m + 1, 0).getDate();
    for(let i = 0; i < firstDay; i++) { const empty = document.createElement('div'); empty.className = 'day empty'; calendar.appendChild(empty); }
    for(let i = 1; i <= daysInMonth; i++) {
        const day = document.createElement('div'); day.className = 'day'; day.textContent = i;
        const dateKey = `${y}-${m + 1}-${i}`; const dayOfWeek = new Date(y, m, i).getDay();
        if(dayOfWeek === 0) { day.classList.add('day-sunday'); }
        if(classData[dateKey] && classData[dateKey].length > 0) { day.classList.add(`has-links-${currentClass}`); }
        day.onclick = () => selectDate(i, isAdmin); calendar.appendChild(day);
    }
}
function selectDate(date, isAdmin) {
    let m = isAdmin? currentMonth : studentMonth; let y = isAdmin? currentYear : studentYear;
    selectedDate = `${y}-${m + 1}-${date}`;
    const dateObj = new Date(y, m, date); const fullDate = dateObj.toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' });
    if(isAdmin) {
        document.getElementById('selectedDate').textContent = `Class ${currentClass} - ${fullDate}`;
        document.getElementById('linkForm').classList.remove('hidden');
        document.getElementById('linkInputs').innerHTML = ''; addLinkInput(); loadSavedLinks();
    } else { loadStudentLinks(date, fullDate); }
}
function addLinkInput() {
    const container = document.getElementById('linkInputs'); const count = container.children.length + 1;
    const div = document.createElement('div'); div.className = 'link-input-group';
    div.innerHTML = `<label>Topic Name:</label><input type="text" class="linkTitle"><label>Link ${count} URL:</label><input type="url" class="linkUrl">`;
    container.appendChild(div);
}
function saveAllLinks() {
    const titles = document.querySelectorAll('.linkTitle'); const urls = document.querySelectorAll('.linkUrl');
    if(!portalData.links[currentClass]) portalData.links[currentClass] = {};
    portalData.links[currentClass][selectedDate] = [];
    for(let i = 0; i < titles.length; i++) {
        if(titles[i].value.trim()) { portalData.links[currentClass][selectedDate].push({title: titles[i].value, url: urls[i].value}); }
    }
    alert('Links Saved! Now click Generate Data button'); loadSavedLinks(); generateCalendar('calendar', 'monthYear', true);
}
function loadSavedLinks() {
    const links = portalData.links[currentClass]?.[selectedDate] || [];
    const div = document.getElementById('savedLinks'); div.innerHTML = '<h4>Saved Links:</h4>';
    links.forEach((link, index) => { div.innerHTML += `<div class="link-item"><div class="link-title">${link.title}</div><a href="${link.url}" target="_blank">${link.url}</a></div>`; });
}
function loadStudentLinks(date, fullDate) {
    let m = studentMonth; let y = studentYear; const dateKey = `${y}-${m + 1}-${date}`;
    const links = portalData.links[currentClass]?.[dateKey] || [];
    const div = document.getElementById('studentLinks'); div.innerHTML = `<h4>Class ${currentClass} - ${fullDate}</h4>`;
    if(links.length === 0) { div.innerHTML += '<p>No links available</p>'; }
    else { links.forEach((link, index) => { div.innerHTML += `<div class="link-item"><div class="link-title">${link.title}</div><a href="${link.url}" target="_blank">${link.url}</a></div>`; }); }
}
function prepareData() { document.getElementById('jsonOutput').value = JSON.stringify(portalData, null, 2); alert('Copy this full data and paste in data.json'); }
function prevMonth() { currentMonth--; if(currentMonth < 0) { currentMonth = 11; currentYear--; } generateCalendar('calendar', 'monthYear', true); }
function nextMonth() { currentMonth++; if(currentMonth > 11) { currentMonth = 0; currentYear++; } generateCalendar('calendar', 'monthYear', true); }
function prevMonthStudent() { studentMonth--; if(studentMonth < 0) { studentMonth = 11; studentYear--; } generateCalendar('studentCalendar', 'monthYearStudent', false); }
function nextMonthStudent() { studentMonth++; if(studentMonth > 11) { studentMonth = 0; studentYear++; } generateCalendar('studentCalendar', 'monthYearStudent', false); }

setInterval(() => { document.getElementById('currentDateTime').textContent = new Date().toLocaleString('en-IN'); }, 1000);
loadData();
</script>
</body>
</html>
